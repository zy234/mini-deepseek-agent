agent:
  step_limit: 0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 3
agents:
  interactive:
    description: 可持续对话并按需使用工具的通用交互 Agent
    flow: iterative
    tools:
      - bash
      - str_replace_editor
      - web_search
      - web_fetch
    system_template_path: prompts/interactive.system.md
    instance_template_path: prompts/interactive.instance.md
  candidate_scout:
    description: 盘前先读板块摘要，再按需查询个股结构并提交待观测清单
    flow: iterative
    step_limit: 30
    wall_time_limit_seconds: 480
    json_output: true
    tools:
      - candidate_details
    system_template_path: prompts/candidate_scout.system.md
    instance_template_path: prompts/candidate_scout.instance.md
    model:
      reasoning_effort: low
      stream_output: false
      observation_template: '{{ output.stdout }}'
      format_error_template: '{{ error }}。查询只能调用 candidate_details，sectors 与 stock_codes 二选一；查询完成后直接返回最终 JSON 对象。'
  chart_reader:
    description: 看日线图与分钟图，对一组标的直接给出买卖结论
    flow: single_shot
    json_output: true
    tools: []
    system_template_path: prompts/chart_reader.system.md
    instance_template_path: prompts/chart_reader.instance.md
    model:
      reasoning_effort: medium
      stream_output: false
  execution_manager:
    description: 汇总读图结论、账户与限额并执行交易的唯一角色
    flow: iterative
    step_limit: 12
    wall_time_limit_seconds: 480
    tools:
      - miniqmt_trade
      - miniqmt_account
      - account_journal
    system_template_path: prompts/execution_manager.system.md
    instance_template_path: prompts/execution_manager.instance.md
    model:
      reasoning_effort: low
trading:
  premarket_at: '09:20'
  round_interval_minutes: 10
  sector_count: 5
  picks_per_sector: 2
  sectors_scanned: 8
  rows_per_sector: 8
  candidate_query_calls: 12
  candidate_detail_limit: 20
  index_codes:
    - 000001.SH
    - 399006.SZ
  daily_chart_days: 30
  max_parallel_groups: 6
  round_json_attempts: 2
environment:
  timeout: 120
  web_search_engines:
    - bing_rss
    - baidu_html
    - sogou_html
    - duckduckgo
  web_search_max_results: 8
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
model:
  temperature: 0
  thinking: true
  api_timeout_seconds: 120
  stream_output: true
