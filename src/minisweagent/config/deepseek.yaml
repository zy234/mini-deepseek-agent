agent:
  step_limit: 0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 3
agents:
  interactive:
    description: 可持续对话并按需使用工具的通用交互 Agent
    flow: iterative
    tools:
      - bash
      - str_replace_editor
      - web_search
      - web_fetch
    system_template_path: prompts/interactive.system.md
    instance_template_path: prompts/interactive.instance.md
  single_call:
    description: 不调用工具、每轮只进行一次模型请求的 Agent
    flow: single_shot
    tools: []
    system_template_path: prompts/single_call.system.md
    instance_template_path: prompts/single_call.instance.md
  financial_research:
    description: 先判断市场情绪方向再对照持仓、按需取证的金融研究 Agent
    flow: iterative
    tools:
      - miniqmt_quotes
      - miniqmt_sectors
      - miniqmt_sector_rank
      - miniqmt_screen
      - miniqmt_history
      - financial_calc
      - web_search
      - web_fetch
    system_template_path: prompts/financial_research.system.md
    instance_template_path: prompts/financial_research.instance.md
  portfolio_manager:
    description: 根据账户和研究候选制定取舍方案的只读组合经理
    flow: iterative
    requires:
      - financial_research
    tools:
      - miniqmt_quotes
      - miniqmt_history
      - miniqmt_account
      - financial_calc
      - web_search
      - web_fetch
    system_template_path: prompts/portfolio_manager.system.md
    instance_template_path: prompts/portfolio_manager.instance.md
  account_trader:
    description: 对组合方案做交易风控判断并按宿主规则执行 MiniQMT 交易 Agent
    flow: iterative
    requires:
      - portfolio_manager
    tools:
      - miniqmt_quotes
      - miniqmt_account
      - miniqmt_trade
    system_template_path: prompts/account_trader.system.md
    instance_template_path: prompts/account_trader.instance.md
  financial_manager:
    description: 每日基于前一收盘统筹研究、组合取舍和交易风控的账户经理
    flow: iterative
    delegates_to:
      - financial_research
      - portfolio_manager
      - account_trader
    tools:
      - agent_call
      - account_journal
      - account_monitor
    system_template_path: prompts/financial_manager.system.md
    instance_template_path: prompts/financial_manager.instance.md
environment:
  timeout: 30
  web_search_engines:
    - bing_rss
    - baidu_html
    - sogou_html
    - duckduckgo
  web_search_max_results: 8
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
model:
  temperature: 0
  thinking: true
  api_timeout_seconds: 60
  stream_output: true
